<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holdfast Digital Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand">Holdfast Archive</div>
  <button class="cartbtn" id="cartBtn" aria-label="Open cart">Cart (<span id="count">0</span>)</button>
</header>
<main>
  <section class="hero">
    <h1>Buy a piece of the record.</h1>
    <p>Holdfast sells licensed digital copies of maps, photographs, manuscripts and field recordings from regional collections. Every purchase is a download you keep.</p>
  </section>
  <div class="tools">
    <input id="q" type="search" placeholder="Search titles, places, years" aria-label="Search the archive">
    <select id="cat" aria-label="Filter by format"><option value="">All formats</option></select>
    <select id="sort" aria-label="Sort"><option value="new">Newest additions</option><option value="low">Price, low to high</option><option value="year">Oldest first</option></select>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<footer>Demo storefront for a course project. No payments are taken and the files are placeholders.</footer>

<dialog id="item"><div class="dlg" id="itemBody"></div></dialog>
<dialog id="cart"><div class="dlg" id="cartBody"></div></dialog>

<script src="js/app.js"></script>
</body>
</html>
